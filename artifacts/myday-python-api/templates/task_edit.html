<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Task — MyDay</title>
    <!-- Anti-flicker: apply saved theme before any paint -->
  <script>(function(){try{if(localStorage.getItem('myday-theme')==='dark')document.documentElement.classList.add('dark');}catch(e){}})()</script>
<link rel="stylesheet" href="{{ base }}/static/style.css?v=19" />
  <link rel="stylesheet" href="{{ base }}/static/tokens.css?v=19" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: var(--md-font-family, 'Lexend', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif); background: var(--md-bg, var(--bg)); color: var(--md-text, var(--text)); min-height: 100vh; }

    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; height: 3.25rem; }
    .nav-logo { font-weight: 800; font-size: 1.15rem; color: var(--accent); text-decoration: none; margin-right: 1.5rem; }
    .nav-links { display: flex; }
    .nav-links a { display: flex; align-items: center; height: 3.25rem; padding: 0 .9rem; font-size: .88rem; font-weight: 500; color: var(--md-text-muted, var(--text-muted)); text-decoration: none; border-bottom: 2px solid transparent; }
    .nav-links a:hover { color: var(--text); }
    .nav-links a.checkin { color: var(--md-warning-text, #D97706); font-weight: 600; }
    .nav-links a.nav-focus { font-size: .82rem; color: var(--md-text-faint, var(--text-faint)); }
    .nav-links a.nav-focus:hover { color: var(--md-text-muted, var(--text-muted)); }

    main { max-width: 580px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

    /* ── Header ── */
    .page-back { display: inline-flex; align-items: center; gap: .35rem; color: var(--md-text-muted, var(--text-muted)); text-decoration: none; font-size: .84rem; font-weight: 500; margin-bottom: 1.25rem; }
    .page-back:hover { color: var(--text); }
    h1 { font-size: 1.4rem; font-weight: 800; margin-bottom: 1.75rem; }

    /* ── Form card ── */
    .form-card { background: var(--md-surface, var(--surface)); border: 1px solid var(--md-border, var(--border)); border-radius: .85rem; padding: 1.5rem 1.6rem; }

    /* ── Field groups ── */
    .field { margin-bottom: 1.2rem; }
    .field:last-child { margin-bottom: 0; }
    label { display: block; font-size:.82rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--md-text-muted, var(--text-muted)); margin-bottom: .4rem; }
    input[type="text"],
    input[type="date"],
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--md-border, var(--border));
      border-radius: .45rem;
      padding: .55rem .8rem;
      font-size: .92rem;
      font-family: inherit;
      color: var(--md-text, var(--text));
      background: var(--md-surface-alt, var(--surface-alt));
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input:focus, textarea:focus, select:focus {
      border-color: var(--accent);
      background: var(--md-surface, var(--surface));
      box-shadow: 0 0 0 3px var(--md-primary-soft, rgba(99,102,241,.1));
    }
    textarea { resize: vertical; min-height: 80px; line-height: 1.55; }

    /* ── Two-column grid ── */
    .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: .85rem; margin-bottom: 1.2rem; }
    @media (max-width: 480px) { .field-grid { grid-template-columns: 1fr; } }

    /* ── Pill chip selector ── */
    .chip-group { display: flex; gap: .45rem; flex-wrap: wrap; }
    .chip-option { display: none; }
    .chip-label {
      display: inline-block;
      padding: .35rem .8rem;
      border: 1.5px solid var(--md-border, var(--border));
      border-radius: 999px;
      font-size: .8rem;
      font-weight: 600;
      color: var(--md-text-muted, var(--text-muted));
      cursor: pointer;
      transition: all .12s;
      user-select: none;
    }
    .chip-option:checked + .chip-label {
      border-color: var(--accent);
      background: var(--md-primary, var(--accent));
      color: #fff;
    }

    /* Energy & time-block color tokens (local — dark mode aware) */
    :root {
      --chip-creative: #5b21b6;
      --chip-admin:    #1e40af;
      --chip-social:   #065f46;
      --chip-low:      #92400e;
      --chip-morning:  #92400e;
      --chip-afternoon:#1e40af;
      --chip-evening:  #5b21b6;
    }
    html.dark {
      --chip-creative: #a78bfa;
      --chip-admin:    #60a5fa;
      --chip-social:   #34d399;
      --chip-low:      #fb923c;
      --chip-morning:  #fb923c;
      --chip-afternoon:#60a5fa;
      --chip-evening:  #a78bfa;
    }

    /* Coloured chip variants */
    .chip-option.energy:checked + .chip-label.creative  { background: var(--chip-creative);  border-color: var(--chip-creative); }
    .chip-option.energy:checked + .chip-label.admin     { background: var(--chip-admin);     border-color: var(--chip-admin); }
    .chip-option.energy:checked + .chip-label.social    { background: var(--chip-social);    border-color: var(--chip-social); }
    .chip-option.energy:checked + .chip-label.low       { background: var(--chip-low);       border-color: var(--chip-low); }
    .chip-option.block:checked  + .chip-label.morning   { background: var(--chip-morning);   border-color: var(--chip-morning); }
    .chip-option.block:checked  + .chip-label.afternoon { background: var(--chip-afternoon); border-color: var(--chip-afternoon); }
    .chip-option.block:checked  + .chip-label.evening   { background: var(--chip-evening);   border-color: var(--chip-evening); }

    /* ── Divider ── */
    .divider { border: none; border-top: 1px solid var(--md-border, var(--border)); margin: 1.4rem 0; }

    /* ── Actions ── */
    .form-actions { display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; padding-top: .25rem; }
    .btn-save { background: var(--md-primary, var(--accent)); color: #fff; border: none; border-radius: .5rem; padding: .65rem 1.6rem; font-size: .95rem; font-weight: 700; cursor: pointer; transition: opacity .15s; }
    .btn-save:hover { opacity: .88; }
    .btn-cancel { color: var(--md-text-muted, var(--text-muted)); text-decoration: none; font-size: .88rem; font-weight: 500; padding: .5rem; }
    .btn-cancel:hover { color: var(--text); }

    /* ── Hint text ── */
    .field-hint { font-size:.82rem; color: var(--md-text-faint, var(--text-faint)); margin-top: .3rem; }

    /* ── Section label ── */
    .section-label {
      font-size:.82rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--md-text-faint, var(--text-faint));
      margin-bottom: .85rem;
      margin-top: .25rem;
    }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="{{ base }}/">MyDay</a>
    <div class="nav-links">
      <a href="{{ base }}/my-day">My Day</a>
      <a href="{{ base }}/morning-checkin" class="checkin">✦ Check In</a>
      <span class="nav-sep"></span>
      <a href="{{ base }}/inbox">Inbox</a>
      <a href="{{ base }}/meetings">Meetings</a>
      <span class="nav-sep"></span>
      <a href="/task-manager/kanban">Kanban</a>
      <a href="{{ base }}/tasks-page">Tasks</a>
      <a href="{{ base }}/projects-list">Projects</a>
      <a href="{{ base }}/notes">Notes</a>
      <a href="{{ base }}/weekly-review">Review</a>
      <a href="{{ base }}/cop-admin">CoP Admin</a>
    </div>
      <div class="focus-controls">
      <button class="ctrl-btn" id="noise-btn" onclick="toggleNoise()" title="Brown noise">🎧 Noise</button>
      <button class="ctrl-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">🌙 Dark</button>
    </div>
  </nav>

  <main>
    <a class="page-back" href="{{ back }}">← Back</a>
    <h1>Edit task</h1>

    <div class="form-card">
      <form method="post" action="{{ base }}/tasks/{{ task.id }}/edit">
        <input type="hidden" name="back" value="{{ back }}" />

        <!-- Title -->
        <div class="field">
          <label for="title">Task title</label>
          <input type="text" id="title" name="title" value="{{ task.title }}" required autofocus />
        </div>

        <!-- Description -->
        <div class="field">
          <label for="description">Notes (optional)</label>
          <textarea id="description" name="description" placeholder="Any extra context, links, or steps…">{{ task.description or '' }}</textarea>
        </div>

        <!-- Assignee -->
        <div class="field">
          <label for="assignee">Assigned to (optional)</label>
          <input type="text" id="assignee" name="assignee" value="{{ task.assignee or '' }}" placeholder="e.g. Paul, Maria…" />
        </div>

        <hr class="divider" />
        <div class="section-label">Status &amp; priority</div>

        <div class="field-grid">
          <!-- Status -->
          <div class="field" style="margin-bottom:0">
            <label for="status">Status</label>
            <select id="status" name="status">
              {% for s in statuses %}
              <option value="{{ s }}" {% if task.status == s %}selected{% endif %}>{{ status_labels[s] }}</option>
              {% endfor %}
            </select>
          </div>

          <!-- Priority -->
          <div class="field" style="margin-bottom:0">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="low"    {% if task.priority == 'low'    %}selected{% endif %}>Low</option>
              <option value="medium" {% if task.priority == 'medium' %}selected{% endif %}>Medium</option>
              <option value="high"   {% if task.priority == 'high'   %}selected{% endif %}>High</option>
            </select>
          </div>
        </div>

        <!-- Status note -->
        <div class="field" style="margin-top:.85rem;">
          <label for="status_note">Status note <span style="font-weight:400;color:var(--text-muted)">(why it's waiting, blockers, context…)</span></label>
          <textarea id="status_note" name="status_note" placeholder="e.g. Waiting on response from client…">{{ task.status_note or '' }}</textarea>
        </div>

        <div class="field-grid" style="margin-top:.85rem;">
          <!-- Due date -->
          <div class="field" style="margin-bottom:0">
            <label for="due_date">Due date</label>
            <input type="date" id="due_date" name="due_date"
              value="{% if task.due_date %}{{ task.due_date.isoformat() }}{% endif %}" />
          </div>

          <!-- Project -->
          <div class="field" style="margin-bottom:0">
            <label for="project_id">Project</label>
            <select id="project_id" name="project_id">
              <option value="">— None —</option>
              {% for p in projects %}
              <option value="{{ p.id }}" {% if task.project_id == p.id %}selected{% endif %}>{{ p.name }}</option>
              {% endfor %}
            </select>
          </div>
        </div>

        <hr class="divider" />
        <div class="section-label">Focus &amp; scheduling</div>

        <!-- Focus state -->
        <div class="field">
          <label>Focus state</label>
          <div class="chip-group">
            <input class="chip-option" type="radio" name="focus_state" id="fs_none" value="none"
              {% if not task.focus_state %}checked{% endif %} />
            <label class="chip-label" for="fs_none">None</label>

            <input class="chip-option" type="radio" name="focus_state" id="fs_now" value="now"
              {% if task.focus_state == 'now' %}checked{% endif %} />
            <label class="chip-label" for="fs_now">⚡ Now</label>

            <input class="chip-option" type="radio" name="focus_state" id="fs_next" value="next"
              {% if task.focus_state == 'next' %}checked{% endif %} />
            <label class="chip-label" for="fs_next">→ Next</label>

            <input class="chip-option" type="radio" name="focus_state" id="fs_later_today" value="later_today"
              {% if task.focus_state == 'later_today' %}checked{% endif %} />
            <label class="chip-label" for="fs_later_today">Today</label>

            <input class="chip-option" type="radio" name="focus_state" id="fs_later" value="later"
              {% if task.focus_state == 'later' %}checked{% endif %} />
            <label class="chip-label" for="fs_later">Parked</label>
          </div>
        </div>

        <!-- Time block -->
        <div class="field">
          <label>Time block</label>
          <div class="chip-group">
            <input class="chip-option block" type="radio" name="time_block" id="tb_none" value="none"
              {% if not task.time_block %}checked{% endif %} />
            <label class="chip-label" for="tb_none">Any time</label>

            <input class="chip-option block" type="radio" name="time_block" id="tb_morning" value="morning"
              {% if task.time_block == 'morning' %}checked{% endif %} />
            <label class="chip-label morning" for="tb_morning">🌅 Morning</label>

            <input class="chip-option block" type="radio" name="time_block" id="tb_afternoon" value="afternoon"
              {% if task.time_block == 'afternoon' %}checked{% endif %} />
            <label class="chip-label afternoon" for="tb_afternoon">☀️ Afternoon</label>

            <input class="chip-option block" type="radio" name="time_block" id="tb_evening" value="evening"
              {% if task.time_block == 'evening' %}checked{% endif %} />
            <label class="chip-label evening" for="tb_evening">🌙 Evening</label>
          </div>
        </div>

        <!-- Energy tag -->
        <div class="field">
          <label>Energy type</label>
          <div class="chip-group">
            <input class="chip-option energy" type="radio" name="energy_tag" id="et_none" value="none"
              {% if not task.energy_tag %}checked{% endif %} />
            <label class="chip-label" for="et_none">Not set</label>

            <input class="chip-option energy" type="radio" name="energy_tag" id="et_creative" value="creative"
              {% if task.energy_tag == 'creative' %}checked{% endif %} />
            <label class="chip-label creative" for="et_creative">✨ Creative</label>

            <input class="chip-option energy" type="radio" name="energy_tag" id="et_admin" value="admin"
              {% if task.energy_tag == 'admin' %}checked{% endif %} />
            <label class="chip-label admin" for="et_admin">📋 Admin</label>

            <input class="chip-option energy" type="radio" name="energy_tag" id="et_social" value="social"
              {% if task.energy_tag == 'social' %}checked{% endif %} />
            <label class="chip-label social" for="et_social">💬 Social</label>

            <input class="chip-option energy" type="radio" name="energy_tag" id="et_low" value="low_energy"
              {% if task.energy_tag == 'low_energy' %}checked{% endif %} />
            <label class="chip-label low" for="et_low">🌿 Low energy</label>
          </div>
          <div class="field-hint">Helps match tasks to how you feel at different times of day.</div>
        </div>

        <!-- energy_type duplicate removed — use the energy_tag chips above -->

        <!-- Time estimate -->
        <div class="field">
          <label for="time_estimate_minutes">Est. minutes</label>
          <input type="number" id="time_estimate_minutes" name="time_estimate_minutes"
                 min="1" max="240" placeholder="e.g. 25"
                 value="{{ task.time_estimate_minutes if task.time_estimate_minutes else '' }}" />
          <div class="field-hint">How long do you expect this to take? (1–240 min)</div>
        </div>

        <hr class="divider" />

        <div class="form-actions">
          <button class="btn-save" type="submit">Save changes</button>
          <a class="btn-cancel" href="{{ back }}">Cancel</a>
        </div>
      </form>
    </div>
  </main>
<script src="{{ base }}/static/app.js?v=19"></script>
</body>
</html>
