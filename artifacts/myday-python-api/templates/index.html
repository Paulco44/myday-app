<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyDay — Task Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f7fa;
      color: #1a202c;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .hero {
      text-align: center;
      padding: 3rem 2rem;
      max-width: 560px;
    }
    .logo {
      font-size: 3rem;
      font-weight: 800;
      letter-spacing: -2px;
      color: #4f46e5;
    }
    .tagline {
      margin-top: .5rem;
      font-size: 1.1rem;
      color: #64748b;
    }
    .actions {
      margin-top: 2.5rem;
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      display: inline-block;
      padding: .75rem 1.75rem;
      border-radius: .5rem;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: opacity .15s;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-outline { border: 2px solid #4f46e5; color: #4f46e5; }
    .stats {
      margin-top: 2rem;
      display: flex;
      gap: 1.5rem;
      justify-content: center;
    }
    .stat { text-align: center; }
    .stat-num { font-size: 1.75rem; font-weight: 700; color: #4f46e5; }
    .stat-lbl { font-size: .8rem; color: #94a3b8; text-transform: uppercase; letter-spacing: .05em; }
  </style>
</head>
<body>
  <div class="hero">
    <div class="logo">MyDay</div>
    <p class="tagline">Simple, focused task management</p>

    <div class="stats">
      <div class="stat">
        <div class="stat-num">{{ projects | length }}</div>
        <div class="stat-lbl">Projects</div>
      </div>
    </div>

    <div class="actions">
      <a class="btn btn-primary" href="{{ base }}/tasks-page">Go to Tasks</a>
      <a class="btn btn-outline" href="{{ base }}/docs">API Docs</a>
    </div>
  </div>
</body>
</html>
