<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MyDay — Task Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    /* ── Nav ── */
    nav { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; height: 3.25rem; }
    .nav-logo { font-weight: 800; font-size: 1.15rem; color: #4f46e5; text-decoration: none; margin-right: 1.5rem; }
    .nav-links { display: flex; gap: 0; }
    .nav-links a { display: flex; align-items: center; height: 3.25rem; padding: 0 .9rem; font-size: .88rem; font-weight: 500; color: #64748b; text-decoration: none; border-bottom: 2px solid transparent; transition: color .15s; }
    .nav-links a:hover { color: #1a202c; }
    .nav-links a.active { color: #4f46e5; border-bottom-color: #4f46e5; }

    .hero { flex: 1; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .hero-inner { text-align: center; max-width: 600px; }
    .logo { font-size: 3rem; font-weight: 800; letter-spacing: -2px; color: #4f46e5; }
    .tagline { margin-top: .5rem; font-size: 1.1rem; color: #64748b; }

    .stats { margin-top: 2rem; display: flex; gap: 2rem; justify-content: center; flex-wrap: wrap; }
    .stat { text-align: center; }
    .stat-num { font-size: 2rem; font-weight: 800; color: #4f46e5; }
    .stat-lbl { font-size: .78rem; color: #94a3b8; text-transform: uppercase; letter-spacing: .05em; margin-top: .15rem; }

    .actions { margin-top: 2.5rem; display: flex; gap: .9rem; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-block; padding: .75rem 1.75rem; border-radius: .5rem; font-size: 1rem; font-weight: 600; text-decoration: none; transition: opacity .15s; }
    .btn:hover { opacity: .85; }
    .btn-primary { background: #4f46e5; color: #fff; }
    .btn-outline { border: 2px solid #4f46e5; color: #4f46e5; }
    .btn-ghost { border: 2px solid #e2e8f0; color: #475569; }
  </style>
</head>
<body>
  <nav>
    <a class="nav-logo" href="{{ base }}/">MyDay</a>
    <div class="nav-links">
      <a href="{{ base }}/my-day">My Day</a>
      <a href="{{ base }}/morning-checkin" style="color:#f59e0b;font-weight:600;">✦ Check In</a>
      <a href="{{ base }}/kanban">Kanban</a>
      <a href="{{ base }}/tasks-page">Tasks</a>
      <a href="{{ base }}/projects-list">Projects</a>
      <a href="{{ base }}/cop-admin">CoP Admin</a>
    </div>
      <div class="focus-controls">
      <button class="ctrl-btn" id="noise-btn" onclick="toggleNoise()" title="Brown noise">🎧 Noise</button>
      <button class="ctrl-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle theme">🌙 Dark</button>
    </div>
  </nav>

  <div class="hero">
    <div class="hero-inner">
      <div class="logo">MyDay</div>
      <p class="tagline">Simple, focused task management</p>

      <div class="stats">
        <div class="stat">
          <div class="stat-num">{{ total_tasks }}</div>
          <div class="stat-lbl">Total Tasks</div>
        </div>
        <div class="stat">
          <div class="stat-num">{{ today_count }}</div>
          <div class="stat-lbl">Today's Focus</div>
        </div>
        <div class="stat">
          <div class="stat-num">{{ doing_count }}</div>
          <div class="stat-lbl">In Progress</div>
        </div>
        <div class="stat">
          <div class="stat-num">{{ projects | length }}</div>
          <div class="stat-lbl">Projects</div>
        </div>
      </div>

      <div class="actions">
        <a class="btn btn-primary" href="{{ base }}/my-day">☀️ My Day</a>
        <a class="btn btn-outline" href="{{ base }}/kanban">📋 Kanban</a>
        <a class="btn btn-ghost" href="{{ base }}/tasks-page">All Tasks</a>
        <a class="btn btn-ghost" href="{{ base }}/docs">API Docs</a>
      </div>
    </div>
  </div>
  <script src="{{ base }}/static/app.js?v=9"></script>
</body>
</html>
